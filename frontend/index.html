<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeSy-Escape — ช่องแชทสืบสวน (FE-1)</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Header: Alliance Theme (Teal + White) -->
  <header class="navbar">
    <div class="brand">🚂 NeSy-Escape</div>
    <div class="modes">
      <button id="btnB" class="active" onclick="setMode('B')">โหมด B (NeSy Engine)</button>
      <button id="btnA" onclick="setMode('A')">โหมด A (Baseline LLM)</button>
    </div>
  </header>

  <!-- FE-1 Chat Main Area -->
  <main class="chat-container">
    <div id="chatFeed" class="chat-feed"></div>

    <form onsubmit="sendMessage(event)" class="chat-input-bar">
      <input id="chatInput" type="text" placeholder="พิมพ์คำสั่งสืบสวนเป็นภาษาไทย..." autocomplete="off" />
      <button type="submit" id="sendBtn">ส่ง</button>
    </form>
  </main>

  <script src="chat.js"></script>
</body>
</html>
