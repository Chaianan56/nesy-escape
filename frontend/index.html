<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeSy-Escape — ระบบสืบสวนคดีฆาตกรรมบนรถไฟ (Alliance UI)</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ================= TOP NAVBAR ================= -->
  <header class="navbar">
    <!-- Brand Logo -->
    <div class="brand">
      <span class="brand-icon">🚂</span>
      <div class="brand-text">
        <span class="brand-name">NeSy-Escape</span>
        <span class="brand-sub">นอกเทิร์นเอกซ์เพรส 1938</span>
      </div>
    </div>

    <!-- HUD Center: Location, Clock, Four Pillars -->
    <div class="nav-hud">
      <!-- ตำแหน่งปัจจุบันของผู้เล่น -->
      <div id="locWidget" class="hud-pill loc-pill" title="ตำแหน่งตู้รถที่ยืนอยู่ปัจจุบัน">
        <span class="hud-icon">📍</span>
        <span id="locText">ตู้โดยสาร</span>
      </div>

      <!-- FE-3: นาฬิกาการสืบสวน -->
      <div id="clockWidget" class="hud-pill clock-pill" title="เวลาที่เหลือในการสืบสวน (ลดลงตาละ 60 วินาที)">
        <span class="hud-icon">⏱️</span>
        <span id="clockText">60:00</span>
      </div>

    </div>
  </header>

  <!-- ================= MAIN CHAT CONTAINER ================= -->
  <main class="chat-container">
    <!-- Stream ของข้อความสนทนาและเนื้อเรื่อง -->
    <div id="chatFeed" class="chat-feed">
      <!-- บรีฟคดี -> คำบรรยายห้องตอนเริ่ม -> การโต้ตอบของผู้เล่น -->
    </div>

    <!-- ข้อ 1: แถบตัวอย่างคำสั่งที่พิมพ์ได้ (Quick Suggestions Bar) -->
    <div class="quick-chips-wrapper">
      <span class="chips-label">💡 คำสั่งแนะนำ:</span>
      <div class="chips-scroll">
        <button type="button" class="chip-btn" onclick="fillInput('ดูรอบๆ')">ดูรอบๆ</button>
        <button type="button" class="chip-btn" onclick="fillInput('สอบปากคำกิเดียน ฮาร์ต')">สอบปากคำกิเดียน ฮาร์ต</button>
        <button type="button" class="chip-btn" onclick="fillInput('ไปที่ห้องเกิดเหตุ')">ไปที่ห้องเกิดเหตุ</button>
        <button type="button" class="chip-btn" onclick="fillInput('ตรวจดูนาฬิกาพกของผู้ตาย')">ตรวจดูนาฬิกาพกของผู้ตาย</button>
        <button type="button" class="chip-btn chip-danger" onclick="fillInput('กล่าวหากิเดียน ฮาร์ต')">กล่าวหากิเดียน ฮาร์ต</button>
      </div>
    </div>

    <!-- Pinned Bottom Input Form -->
    <form onsubmit="sendMessage(event)" class="chat-input-bar">
      <div class="input-inner">
        <input 
          id="chatInput" 
          type="text" 
          placeholder="พิมพ์คำสั่งสืบสวนเป็นภาษาไทย (หรือคลิกตัวอย่างคำสั่งด้านบน)..." 
          autocomplete="off" 
        />
        <button type="submit" id="sendBtn" class="send-button">
          <span id="sendBtnText">ส่งคำสั่ง</span>
          <svg class="send-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <div class="input-hint">
        <span>คำสั่งถูกส่งไปประมวลผลผ่าน Neural Interpretation Layer &amp; Symbolic Rule Engine</span>
      </div>
    </form>
  </main>

  <script src="chat.js"></script>
</body>
</html>
